<!-- DOCTYPE não é uma marcação HTML e é usada para determinar. 
 Ela determina que a marcação em questão é html5 sendo esta a parão e universal. -->
<!DOCTYPE html>

<!-- lang="" define idioma da página útil para tecnologias assistivas 
 saberem interagir com a página de forma adequada -->
<html lang="pt-BR">

<head>
  <!-- O title marca o nome das páginas passando informações importantes 
    para ferramentas de busca e indexação -->
  <title>Documento HTML Mínimo</title>

  <!-- A tag vazia "meta" (tag de metadado) 
    serve para fornecer dados adicionais sobre a página.
    No caso abaixo, ela determina em qual codificação a página deve ser escrita-->
  <meta charset="utf-8"> 
</head>

<!-- A tag body recebe diversas outras tags html.
  É aqui onde o conteúdo é renderizado e exibido ao usuário. -->
<body>
  <h1>Este é um título de nível "h1"</h1>
  <p>este é um parágrafo padrão, "p"</p>
</body>
</html>
